name: Publish QGIS plugin
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag (for example v0.6.3)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qgis-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: qgis-plugin
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'qgis-plugin-ci==2.10.0'
      - name: Validate tag and upload the tested package
        run: python scripts/publish.py
